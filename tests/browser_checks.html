<h1>星图浏览器回归检查</h1><p id="status">正在检查…</p><ol id="results"></ol><canvas id="surface"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","../web/shared/sky_render.mjs":"../web/shared/sky_render.mjs?v=20260915-atlas-disks-1","../web/v1/sky_atlas_bodies.mjs":"../web/v1/sky_atlas_bodies.mjs?v=20260915-atlas-disks-1","../web/v1/sky_atlas_stars.mjs":"../web/v1/sky_atlas_stars.mjs?v=20260915-atlas-disks-1","../web/v1/sky_controls.mjs":"../web/v1/sky_controls.mjs?v=20260915-atlas-disks-1","../web/v1/sky_state.mjs":"../web/v1/sky_state.mjs?v=20260915-atlas-disks-1","../web/v1/sky_points.js":"../web/v1/sky_points.js?v=20260915-atlas-disks-1","../web/v1/sky_motion_3d.js":"../web/v1/sky_motion_3d.js?v=20260915-atlas-disks-1","../web/v1/sky_view.js":"../web/v1/sky_view.js?v=20260915-atlas-disks-1","../web/shared/sky_projection.js":"../web/shared/sky_projection.js?v=20260915-atlas-disks-1","../web/shared/sky_projection.mjs":"../web/shared/sky_projection.mjs?v=20260915-atlas-disks-1","../web/shared/sky_point_kernel.mjs":"../web/shared/sky_point_kernel.mjs?v=20260915-atlas-disks-1","../web/v1/sky_atlas.mjs":"../web/v1/sky_atlas.mjs?v=20260915-atlas-disks-1","./lunar_occlusion_render_audit.mjs":"./lunar_occlusion_render_audit.mjs?v=20260915-atlas-disks-1","./body_render_audit.mjs":"./body_render_audit.mjs?v=20260915-atlas-disks-1","./projection_render_audit.mjs":"./projection_render_audit.mjs?v=20260915-atlas-disks-1","./atlas_playback_checks.mjs":"./atlas_playback_checks.mjs?v=20260915-atlas-disks-1","./test_sky_motion.mjs":"./test_sky_motion.mjs?v=20260915-atlas-disks-1","./test_atlas_resources.mjs":"./test_atlas_resources.mjs?v=20260915-atlas-disks-1","./lunar_phase_render_audit.mjs":"./lunar_phase_render_audit.mjs?v=20260915-atlas-disks-1","./test_sky_projection.mjs":"./test_sky_projection.mjs?v=20260915-atlas-disks-1","./sky_render_fixture.mjs":"./sky_render_fixture.mjs?v=20260915-atlas-disks-1","./atlas_texture_audit.mjs":"./atlas_texture_audit.mjs?v=20260915-atlas-disks-1","./zoom_render_audit.mjs":"./zoom_ren <script type="module">
import * as THREE from 'three';
import {SkyView,pickNearestStar} from '../web/v1/sky_view.js';
let failures=0,total=0;
const camera=new THREE.PerspectiveCamera(60,1920/1080,.1,5000);
const view=new SkyView(camera,document.querySelector('canvas'));
function assert(condition,message){if(!condition)throw new Error(message);}
function test(name,check){total++;const li=document.createElement('li');try{check();li.textContent=`通过：${name}`;li.className='pass';}catch(error){failures++;li.textContent=`失败：${name} — ${error.message}`;li.className='fail';}document.querySelector('#results').append(li);}
function direction(){return camera.getWorldDirection(new THREE.Vector3());}
test('初始观测者在原点，朝向赤经0度',()=>{assert(camera.position.length()===0,'相机偏移');assert(direction().distanceTo(new THREE.Vector3(1,0,0))<1e-10,'朝向错误');});
test('缩放保持观测者位置、朝向和天球角距',()=>{const before=direction();for(const delta of [-500,2000,-10000,10000]){view.zoom(delta);assert(camera.position.length()===0,'相机离开原点');assert(direction().distanceTo(before)<1e-10,'缩放改变朝向');assert(camera.fov>=1&&camera.fov<=100,'视场越界');camera.updateMatrixWorld();const a=new THREE.Vector3(1000,0,0),b=new THREE.Vector3(1000*Math.cos(Math.PI/6),500,0);const reconstructed=b.clone().project(camera).unproject(camera).sub(camera.position).normalize();assert(Math.abs(a.angleTo(reconstructed)-Math.PI/6)<1e-9,'30度角距改变');}});
test('正反方向聚焦中途不会归一化零向量或瞬间翻转',()=>{view.reset();view.focus(new THREE.Vector3(-1,0,0),1000,0);view.update((1-Math.cbrt(.5))*1000);assert(Math.abs(direction().x)<1e-8,'半程朝向未沿球面转动');assert(camera.quaternion.toArray().every(Number.isFinite),'非法四元数');assert(camera.position.length()===0,'聚焦改变位置');view.update(1000);assert(direction().distanceTo(new THREE.Vector3(-1,0,0))<1e-9,'未对准目标');});
test('天球正负极可聚焦',()=>{for(const z of [-1,1]){view.focus(new THREE.Vector3(0,0,z),0,0);assert(direction().distanceTo(new THREE.Vector3(0,0,z))<1e-9,'天极错位');}});
test('连续聚焦后重置取消旧动画并恢复初始视角',()=>{view.focus(new THREE.Vector3(0,1,0),1000,0);view.focus(new THREE.Vector3(0,-1,0),1000,100);view.zoom(-300);view.reset();view.update(10000);assert(camera.fov===60&&camera.position.length()===0,'重置失败');assert(direction().distanceTo(new THREE.Vector3(1,0,0))<1e-9,'旧动画覆盖重置');});
test('拖动只改变朝向，极点附近保持有效旋转',()=>{for(const pair of [[80,60],[0,100000],[0,-200000]]){view.rotate(...pair);assert(camera.position.length()===0,'拖动移动观测者');assert(camera.quaternion.toArray().every(Number.isFinite),'非法朝向');}});
test('宽屏点击按像素距离选择较近恒星',()=>{view.reset();camera.updateMatrixWorld();const point=(dx,dy)=>new THREE.Vector3(2*dx/1920,-2*dy/1080,.5).unproject(camera).normalize().multiplyScalar(1000);const a={id:'horizontal40',normalizedPos:point(40,0)},b={id:'vertical30',normalizedPos:point(0,-30)};assert(pickNearestStar([a,b],camera,960,540,{left:0,top:0,width:1920,height:1080},50)===b,'纵横比改变选星顺序');});
test('相机背后恒星不能被点击',()=>{assert(pickNearestStar([{id:'behind',normalizedPos:new THREE.Vector3(-1000,0,0)}],camera,960,540,{left:0,top:0,width:1920,height:1080})===null,'选中了背后星');});
test('实际滚轮监听调整视场而非相机位置',()=>{view.reset();document.querySelector('canvas').dispatchEvent(new WheelEvent('wheel',{deltaY:-100,cancelable:true}));assert(camera.fov<60&&camera.position.length()===0,'滚轮行为错误');});
view.dispose();document.querySelector('#surface').remove();document.querySelector('#status').textContent=`${total-failures}/${total} 通过；${failures} 失败`;
</script></html>
