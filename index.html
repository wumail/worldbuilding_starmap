<span class="eyebrow">TERRAX · 从母星仰望</span><h1>同一片星空，两种观看方式</h1>
<p class="intro">两个版本共用恒星、星云、星团与十五黄道天区。各自保留观察设置，都可以从 Terrax 查看日月和行星随时间的运行。</p>
<div class="versions">
<article aria-labelledby="v1-title"><span class="version">V1</span><h2 id="v1-title">标准星图</h2><p>保留原有星图表现，方便辨认天体、查看全天分布与运动轨迹。</p><div class="links"><a data-version="v1" href="web/v1/sky_atlas.html">平面星图</a><a data-version="v1" href="web/v1/star_map.html">沉浸天球</a></div></article>
<article aria-labelledby="v2-title"><span class="version">V2</span><h2 id="v2-title">肉眼观看</h2><p>加入屏幕观看尺度校准、大气与昼夜、可调光扩散，探索更接近肉眼的观察表现。</p><div class="links"><a data-version="v2" href="web/v2/sky_atlas.html">平面星图</a><a data-version="v2" href="web/v2/star_map.html">沉浸天球</a></div></article>
</div>
<p class="note">两版均保留天体显示增强；真实角径与星等可在天体面板查看。V2 是基于物理量的观察近似。进动、章动仍处于独立核验阶段。</p>
